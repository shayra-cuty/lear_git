<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World State Stream</title>
    <style>
        /* Modern Video Engine Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, Arial, sans-serif;
        }

        :root {
            --bg-main: #0f0f0f;      /* YouTube Dark Mode Pitch Black */
            --bg-card: #212121;      /* Elevated Dark Gray Card Color */
            --bg-hover: #3d3d3d;     /* Highlight Focus Tones */
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --primary-red: #ff0000;  /* Stream Red */
            --border: #303030;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-top: 56px;
        }

        /* Top Search Header Bar Layout */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background-color: #212121;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand {
            color: var(--text-main);
            font-size: 1.35rem;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }

        .brand span {
            background-color: var(--primary-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .nav-center {
            display: flex;
            max-width: 600px;
            width: 100%;
            margin: 0 20px;
        }

        .search-input {
            width: 100%;
            padding: 8px 16px;
            background-color: #121212;
            border: 1px solid var(--border);
            border-radius: 40px 0 0 40px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-btn {
            background-color: #303030;
            border: 1px solid var(--border);
            border-left: none;
            padding: 0 20px;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
            color: white;
        }

        /* Clickable Profile Badge Button Link */
        .profile-badge-link {
            text-decoration: none;
            display: inline-block;
        }

        .profile-badge {
            width: 40px;
            height: 40px;
            background-color: #6366f1; /* Bright indigo accent */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border: 2px solid transparent;
        }

        .profile-badge:hover {
            background-color: #4f46e5;
            transform: scale(1.05);
            border-color: white;
        }

        /* Sidebar Navigation Column */
        .sidebar {
            width: 240px;
            height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            background-color: var(--bg-main);
            padding: 12px;
            overflow-y: auto;
        }

        .sidebar-section {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .sidebar-section h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 4px 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        /* Structural Sidebar Navigation Item Links */
        .sidebar-link {
            text-decoration: none;
            color: var(--text-main);
            display: block;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .sidebar-item:hover {
            background-color: var(--bg-card);
        }

        .sidebar-item.active {
            background-color: var(--bg-hover);
        }

        /* Main Scrollable Dashboard Stream Viewport */
        .content-wrapper {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 24px;
        }

        /* Top Interactive Filter Topic Chips */
        .chips-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .chip {
            background-color: var(--bg-card);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .chip:hover { background-color: var(--bg-hover); }
        .chip.active { background-color: white; color: black; }

        /* Creator Upload Publisher Form Card */
        .upload-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-row {
            display: flex;
            gap: 12px;
        }

        .upload-panel input, .upload-panel select {
            background-color: #121212;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        .upload-panel input { flex-grow: 1; }

        .broadcast-btn {
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 10px 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .broadcast-btn:hover { background-color: #cc0000; }

        /* Responsive YouTube-Style Main Video Dashboard Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px 16px;
            margin-bottom: 40px;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Offline Thumbnail Container Graphics Block */
        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #333;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .thumbnail-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .play-overlay {
            font-size: 2.5rem;
            color: white;
            opacity: 0.6;
            z-index: 2;
            transition: transform 0.2s, opacity 0.2s;
        }

        .video-card:hover .play-overlay {
            transform: scale(1.1);
            opacity: 1;
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0,0,0,0.8);
            color: white;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 500;
            z-index: 2;
        }

        /* Video Meta Grid details layouts */
        .video-details {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .video-info h4 {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 4px;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Portrait Mobile Shorts Section Slider */
        .shorts-shelf {
            border-top: 4px solid var(--border);
            border-bottom: 4px solid var(--border);
            padding: 24px 0;
            margin: 40px 0;
        }

        .shorts-shelf-title {
            font-size: 1.25rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shorts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .short-card {
            cursor: pointer;
        }

        .short-thumbnail {
            width: 100%;
        }
