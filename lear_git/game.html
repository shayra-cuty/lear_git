<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Tic-Tac-Toe</title>
    <style>
        /* Modern UI Style Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a; /* Sleek Deep Blue Dark Mode */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        /* Status Turn Box Indicator */
        .status-box {
            font-size: 1.2rem;
            margin-bottom: 25px;
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        /* The 3x3 Game Board Grid Layout */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: #334155;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Single Grid Tile Box */
        .tile {
            background-color: #1e293b;
            border: none;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .tile:hover {
            background-color: #475569;
        }

        .tile:active {
            transform: scale(0.95);
        }

        /* Unique Color Profiles for Players */
        .tile.x-player { color: #f43f5e; } /* Rose Red X */
        .tile.o-player { color: #10b981; } /* Emerald Green O */

        /* Control UI Actions */
        .reset-btn {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .reset-btn:hover {
            opacity: 0.9;
        }
        
        .reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div class="status-box" id="status">Player X's turn</div>

    <!-- The Game Matrix Structure -->
    <div class="game-board" id="board">
        <button class="tile" data-index="0"></button>
        <button class="tile" data-index="1"></button>
        <button class="tile" data-index="2"></button>
        <button class="tile" data-index="3"></button>
        <button class="tile" data-index="4"></button>
        <button class="tile" data-index="5"></button>
        <button class="tile" data-index="6"></button>
        <button class="tile" data-index="7"></button>
        <button class="tile" data-index="8"></button>
    </div>

    <button class="reset-btn" id="resetBtn">Restart Match</button>

    <!-- JavaScript Interactive Logic Engine -->
    <script>
        const board = document.getElementById('board');
        const tiles = document.querySelectorAll('.tile');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        
        let currentPlayer = "X";
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        // Mathematical Win Condition Matrix Index Combinations
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function handleTileClick(event) {
            const clickedTile = event.target;
            const clickedIndex = parseInt(clickedTile.getAttribute('data-index'));

            if (gameState[clickedIndex] !== "" || !isGameActive) {
                return;
            }

            // Update Game State tracking variables
            gameState[clickedIndex] = currentPlayer;
            clickedTile.textContent = currentPlayer;
            clickedTile.classList.add(currentPlayer === "X" ? 'x-player' : 'o-player');

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `Player ${currentPlayer} Wins! 🎉`;
                isGameActive = false;
                return;
            }

            // Check for Tie Scenario
            if (!gameState.includes("")) {
                statusText.textContent = "It's a Draw! 🤝";
                isGameActive = false;
                return;
            }

            // Swap Turn Controls
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusText.textContent = `Player ${currentPlayer}'s turn`;
        }

        function resetGame() {
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.textContent = "Player X's turn";
            tiles.forEach(tile => {
                tile.textContent = "";
                tile.classList.remove('x-player', 'o-player');
            });
        }

        // Event Listener triggers
        tiles.forEach(tile => tile.addEventListener('click', handleTileClick));
        resetBtn.addEventListener('click', resetGame);
    </script>

</body>
</html>
